; NoBlowUpPlayerCar (GTA SA 1.0 US) - NOT COMPILED, NOT TESTED
; The "blow up all cars" cheat does not blow up the vehicle you are driving.
[Settings]
; 1 = writes NoBlowUpPlayerCar.log in the game folder (shows the address that called BlowUpCar)
EnableLog=0

; Advanced: address of the cheat function and the size of the range treated as "called by the cheat".
; Only change them if the log shows "from cheat=0" for a caller that really came from the cheat.
;CheatFunction=0x439D80
;CheatRange=0x100
